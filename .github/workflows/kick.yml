name: 808 kicks
# Schedule off — cron-job.org owns the clock.
# Keep this for a manual test from Actions → Run workflow.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "carousel | pin | brief | reel | wake"
        default: "wake"
        required: true
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: pick url
        id: pick
        env:
          MANUAL: "${{ github.event.inputs.job }}"
        run: |
          BASE="https://eight08dystopiabot.onrender.com"
          JOB="${MANUAL:-wake}"
          case "$JOB" in
            carousel) URL="$BASE/run/carousel" ;;
            pin) URL="$BASE/run/pin" ;;
            brief) URL="$BASE/run/brief" ;;
            reel) URL="$BASE/run/reel" ;;
            *) URL="$BASE/wake" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Kicking $JOB $URL"
      - name: ping
        run: |
          CODE=$(curl -sS -m 25 -o /tmp/kick.json -w "%{http_code}" "${{ steps.pick.outputs.url }}")
          echo "status $CODE"
          cat /tmp/kick.json || true
          echo
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
            exit 1
          fi
