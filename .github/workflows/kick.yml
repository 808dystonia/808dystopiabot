name: 808 kicks
# UTC times = CDT (UTC-5). After CST starts Nov 1, shift +1 hour.
on:
  schedule:
    - cron: "58 13 * * *"
    - cron: "8 14 * * *"
    - cron: "58 22 * * *"
    - cron: "58 23 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "carousel | pin | brief | reel | wake"
        default: "wake"
        required: true
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: pick url
        id: pick
        env:
          CRON: "${{ github.event.schedule }}"
          MANUAL: "${{ github.event.inputs.job }}"
        run: |
          BASE="https://eight08dystopiabot.onrender.com"
          JOB="$MANUAL"
          case "$CRON" in
            "58 13 * * *") JOB=carousel ;;
            "8 14 * * *") JOB=pin ;;
            "58 22 * * *") JOB=brief ;;
            "58 23 * * *") JOB=reel ;;
          esac
          JOB="${JOB:-wake}"
          case "$JOB" in
            carousel) URL="$BASE/run/carousel" ;;
            pin) URL="$BASE/run/pin" ;;
            brief) URL="$BASE/run/brief" ;;
            reel) URL="$BASE/run/reel" ;;
            *) URL="$BASE/wake" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Kicking $JOB $URL"
      - name: ping
        run: |
          CODE=$(curl -sS -m 25 -o /tmp/kick.json -w "%{http_code}" "${{ steps.pick.outputs.url }}")
          echo "status $CODE"
          cat /tmp/kick.json || true
          echo
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
            exit 1
          fi
